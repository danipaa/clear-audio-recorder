name: Build Android app

# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's runner already has the Android SDK installed.

      - name: Install packages
        run: npm ci

      - name: Test the audio engine
        run: npm test

      - name: Build the app's web layer and copy it into Android
        run: npm run sync

      - name: Add signing key (only if you've saved it as a secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-key.jks
            echo "Signing key found: building a Play Store release too."
          else
            echo "No signing key yet: building the test APK only."
          fi

      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          if [ -f app/upload-key.jks ]; then ./gradlew bundleRelease assembleRelease --no-daemon; fi

      - name: Upload test APK (install this on your phone)
        uses: actions/upload-artifact@v4
        with:
          name: clear-audio-recorder-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload signed APK (use this one to test Google sign-in)
        if: hashFiles('android/app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: clear-audio-recorder-signed-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Play Store bundle (.aab)
        if: hashFiles('android/app/build/outputs/bundle/release/*.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: clear-audio-recorder-play-store-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # Puts the newest APK on the repo's Releases page so it can be downloaded straight to a phone.
      - name: Publish APK to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk clear-audio-recorder-test.apk
          FILES="clear-audio-recorder-test.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk clear-audio-recorder-signed.apk
            FILES="$FILES clear-audio-recorder-signed.apk"
          fi
          gh release view latest-build >/dev/null 2>&1 || gh release create latest-build --title "Latest build" --notes "Newest app build. Replaced on every build." --prerelease
          gh release upload latest-build $FILES --clobber
